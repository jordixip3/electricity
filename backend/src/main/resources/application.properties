# Server configuration
server.port=8080
server.servlet.context-path=/api

# Oracle DB Connection Configuration
# Oracle corre en VM VirtualBox (NAT 10.0.2.15) en PC Host 192.168.1.135
# Port Forwarding VirtualBox: Host 192.168.1.135:1521 → Guest 10.0.2.15:1521
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@192.168.1.135:1521/ORCLPDB1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:APP_ELECTRICIDAD}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Oracle123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate/JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Hikari Connection Pool Optimization for Remote Oracle Host
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=15000

# Logging Configuration
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# JWT Configuration
app.jwt.secret=ElectricidadSecretKey2024XyZ!@#$%^&*()
spring.flyway.enabled=false
app.jwt.expiration-hours=24
